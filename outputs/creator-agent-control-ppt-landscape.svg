<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">제작자 중심 에이전트 관리</title><desc id="desc">PPT 가로 한 페이지용 에이전트 사용 통제 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFA"/><stop offset="1" stop-color="#EAF3EE"/></linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#386858" flood-opacity=".13"/></filter>
    <style>.k{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}.title{font-size:50px;font-weight:800;fill:#25483C;letter-spacing:-2px}.sub{font-size:24px;font-weight:500;fill:#657A71;letter-spacing:-.8px}.step{font-size:16px;font-weight:800;fill:#386858;letter-spacing:1.2px}.head{font-size:26px;font-weight:800;fill:#294B40;letter-spacing:-1.3px}.body{font-size:19px;font-weight:500;fill:#63776E;letter-spacing:-.75px}.foot{font-size:27px;font-weight:800;fill:#386858;letter-spacing:-1px}</style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1830" cy="80" r="220" fill="#DFEDE6"/><circle cx="80" cy="1030" r="180" fill="#E4F0EA"/>
  <g class="k"><text x="960" y="108" text-anchor="middle" class="title">에이전트의 사용 방식은 제작자가 직접 관리합니다</text><text x="960" y="155" text-anchor="middle" class="sub">공유 이후에도 권한, 한도, 정책을 일관되게 통제할 수 있습니다.</text>
    <!-- arrows --> <g fill="none" stroke="#76A693" stroke-width="5" stroke-linecap="round"><path d="M394 485h45"/><path d="M754 485h45"/><path d="M1114 485h45"/><path d="M1474 485h45"/></g><g fill="#76A693"><path d="M429 475l18 10-18 10z"/><path d="M789 475l18 10-18 10z"/><path d="M1149 475l18 10-18 10z"/><path d="M1509 475l18 10-18 10z"/></g>
    <!-- 1 --> <g filter="url(#sh)"><rect x="74" y="280" width="320" height="410" rx="28" fill="#fff"/></g><rect x="104" y="310" width="67" height="33" rx="16.5" fill="#E3F0EA"/><text x="137.5" y="333" text-anchor="middle" class="step">01</text><circle cx="234" cy="422" r="56" fill="#E7F3ED"/><path d="M206 438v-37l28-13 28 13v37l-28 15zM219 415h30M219 426h30" fill="none" stroke="#386858" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="234" y="535" text-anchor="middle" class="head">작업 범위 설정</text><text x="234" y="581" text-anchor="middle" class="body">수행 가능한 업무와</text><text x="234" y="611" text-anchor="middle" class="body">도구를 직접 지정</text>
    <!-- 2 --> <g filter="url(#sh)"><rect x="434" y="280" width="320" height="410" rx="28" fill="#fff"/></g><rect x="464" y="310" width="67" height="33" rx="16.5" fill="#E3F0EA"/><text x="497.5" y="333" text-anchor="middle" class="step">02</text><circle cx="594" cy="422" r="56" fill="#E7F3ED"/><path d="M594 391a20 20 0 1 1 0 40a20 20 0 0 1 0-40zm-34 76c4-16 18-27 34-27s30 11 34 27M636 406h27v29h-27zM642 406v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#386858" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="535" text-anchor="middle" class="head">접근 권한 관리</text><text x="594" y="581" text-anchor="middle" class="body">사용자별 역할과</text><text x="594" y="611" text-anchor="middle" class="body">접근 범위를 제어</text>
    <!-- 3 --> <g filter="url(#sh)"><rect x="794" y="260" width="320" height="450" rx="28" fill="#386858"/></g><rect x="824" y="290" width="67" height="33" rx="16.5" fill="#5D8A7A"/><text x="857.5" y="313" text-anchor="middle" fill="#E9F4EE" style="font:800 16px Pretendard,'Apple SD Gothic Neo',sans-serif;letter-spacing:1.2px">03</text><circle cx="954" cy="422" r="56" fill="#5C8879"/><path d="M926 418h56v43h-56zM935 418v-11a19 19 0 0 1 38 0v11M954 432v14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="954" y="535" text-anchor="middle" fill="#fff" style="font-size:26px;font-weight:800;letter-spacing:-1.3px">사용 횟수 · 한도</text><text x="954" y="581" text-anchor="middle" fill="#E3F1EA" style="font-size:19px;font-weight:500;letter-spacing:-.75px">사용량, 예산, 실행을</text><text x="954" y="611" text-anchor="middle" fill="#E3F1EA" style="font-size:19px;font-weight:500;letter-spacing:-.75px">제작자가 직접 제한</text><text x="954" y="663" text-anchor="middle" fill="#C6E0D4" style="font-size:16px;font-weight:700;letter-spacing:.5px">공유해도 통제권은 유지</text>
    <!-- 4 --> <g filter="url(#sh)"><rect x="1154" y="280" width="320" height="410" rx="28" fill="#fff"/></g><rect x="1184" y="310" width="67" height="33" rx="16.5" fill="#E3F0EA"/><text x="1217.5" y="333" text-anchor="middle" class="step">04</text><circle cx="1314" cy="422" r="56" fill="#E7F3ED"/><path d="M1287 419a28 28 0 1 0 8-20M1287 391v15h15M1314 404v21l14 8" fill="none" stroke="#386858" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1314" y="535" text-anchor="middle" class="head">수정 · 중단 · 업데이트</text><text x="1314" y="581" text-anchor="middle" class="body">정책을 바꾸거나</text><text x="1314" y="611" text-anchor="middle" class="body">운영을 즉시 중단</text>
    <!-- 5 --> <g filter="url(#sh)"><rect x="1514" y="280" width="320" height="410" rx="28" fill="#fff"/></g><rect x="1544" y="310" width="67" height="33" rx="16.5" fill="#E3F0EA"/><text x="1577.5" y="333" text-anchor="middle" class="step">05</text><circle cx="1674" cy="422" r="56" fill="#E7F3ED"/><path d="M1674 390l29 12v20c0 19-13 34-29 41c-16-7-29-22-29-41v-20zM1660 419l9 9 19-21" fill="none" stroke="#386858" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1674" y="535" text-anchor="middle" class="head">안전 정책 적용</text><text x="1674" y="581" text-anchor="middle" class="body">부적절한 요청과</text><text x="1674" y="611" text-anchor="middle" class="body">사용 방식을 제한</text>
    <g filter="url(#sh)"><rect x="300" y="810" width="1320" height="116" rx="28" fill="#fff"/></g><circle cx="373" cy="868" r="30" fill="#E3F0EA"/><path d="M359 869l10 10 20-24" fill="none" stroke="#386858" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="435" y="879" class="foot">에이전트를 공유하더라도, 어떻게 사용될지는 제작자가 결정합니다.</text>
  </g>
</svg>
