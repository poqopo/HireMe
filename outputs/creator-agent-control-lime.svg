<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">제작자 중심 에이전트 관리</title>
  <desc id="desc">에이전트 제작자가 작업 범위, 접근 권한, 사용 한도, 업데이트, 안전 정책을 관리하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAFDF7"/><stop offset="1" stop-color="#EEF7E4"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B7035"/><stop offset="1" stop-color="#76AE49"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#386B32" flood-opacity=".13"/></filter>
    <style>
      .k{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}.title{font-size:39px;font-weight:800;fill:#263F27;letter-spacing:-1.5px}.sub{font-size:19px;font-weight:500;fill:#697C69;letter-spacing:-.5px}.step{font-size:14px;font-weight:800;fill:#4A8A36;letter-spacing:1.2px}.head{font-size:21px;font-weight:800;fill:#263C28;letter-spacing:-1px}.body{font-size:16px;font-weight:500;fill:#657666;letter-spacing:-.55px}.footer{font-size:18px;font-weight:700;fill:#314D32;letter-spacing:-.5px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1450" cy="90" r="220" fill="#DFEFD0" opacity=".55"/><circle cx="100" cy="835" r="180" fill="#E4F2D4" opacity=".7"/>
  <g class="k"><text x="800" y="105" text-anchor="middle" class="title">에이전트의 사용 방식은 제작자가 직접 관리합니다</text><text x="800" y="145" text-anchor="middle" class="sub">공유 이후에도 권한, 한도, 정책과 운영 상태를 일관되게 통제할 수 있습니다.</text><rect x="655" y="175" width="290" height="34" rx="17" fill="#E4F3D7"/><text x="800" y="198" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#4D873B;letter-spacing:1.2px">CREATOR-CONTROLLED AGENT</text>
    <g fill="none" stroke="#95C96B" stroke-width="4" stroke-linecap="round"><path d="M318 435H358"/><path d="M598 435H638"/><path d="M962 435H1002"/><path d="M1242 435H1282"/></g><g fill="#95C96B"><path d="M350 427l14 8-14 8z"/><path d="M630 427l14 8-14 8z"/><path d="M994 427l14 8-14 8z"/><path d="M1274 427l14 8-14 8z"/></g>
    <g filter="url(#shadow)"><rect x="78" y="295" width="240" height="280" rx="24" fill="#fff"/></g><rect x="102" y="319" width="57" height="30" rx="15" fill="#EAF6DD"/><text x="130.5" y="340" text-anchor="middle" class="step">01</text><circle cx="198" cy="398" r="43" fill="#EDF8E1"/><path d="M176 410v-31l22-10 22 10v31l-22 12zM187 391h22M187 400h22" fill="none" stroke="#64A94A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="198" y="485" text-anchor="middle" class="head">작업 범위 설정</text><text x="198" y="518" text-anchor="middle" class="body">에이전트가 수행할 수 있는</text><text x="198" y="542" text-anchor="middle" class="body">업무와 도구를 지정</text>
    <g filter="url(#shadow)"><rect x="358" y="295" width="240" height="280" rx="24" fill="#fff"/></g><rect x="382" y="319" width="57" height="30" rx="15" fill="#EAF6DD"/><text x="410.5" y="340" text-anchor="middle" class="step">02</text><circle cx="478" cy="398" r="43" fill="#EDF8E1"/><path d="M478 370a17 17 0 1 1 0 34a17 17 0 0 1 0-34zm-28 63c3-14 15-23 28-23s25 9 28 23M513 383h22v25h-22zM518 383v-6a6 6 0 0 1 12 0v6" fill="none" stroke="#64A94A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="478" y="485" text-anchor="middle" class="head">접근 권한 관리</text><text x="478" y="518" text-anchor="middle" class="body">사용자별 역할과</text><text x="478" y="542" text-anchor="middle" class="body">접근 범위를 제어</text>
    <g filter="url(#shadow)"><rect x="638" y="265" width="324" height="340" rx="28" fill="url(#hero)"/></g><circle cx="800" cy="390" r="49" fill="#7FAF54"/><path d="M775 386h50v37h-50zM783 386v-9a17 17 0 0 1 34 0v9M800 398v12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="485" text-anchor="middle" fill="#fff" style="font-size:22px;font-weight:800;letter-spacing:-1px">사용 횟수 · 한도 설정</text><text x="800" y="518" text-anchor="middle" fill="#E7F5D8" style="font-size:16px;font-weight:500;letter-spacing:-.55px">사용량, 예산, 실행 횟수를</text><text x="800" y="542" text-anchor="middle" fill="#E7F5D8" style="font-size:16px;font-weight:500;letter-spacing:-.55px">제작자가 직접 제한</text><text x="800" y="579" text-anchor="middle" fill="#D4EBBD" style="font-size:13px;font-weight:700;letter-spacing:.5px">공유해도 통제권은 유지</text>
    <g filter="url(#shadow)"><rect x="1002" y="295" width="240" height="280" rx="24" fill="#fff"/></g><rect x="1026" y="319" width="57" height="30" rx="15" fill="#EAF6DD"/><text x="1054.5" y="340" text-anchor="middle" class="step">04</text><circle cx="1122" cy="398" r="43" fill="#EDF8E1"/><path d="M1099 395a24 24 0 1 0 7-17M1099 371v13h13M1122 382v17l12 7" fill="none" stroke="#64A94A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1122" y="485" text-anchor="middle" class="head">수정 · 중단 · 업데이트</text><text x="1122" y="518" text-anchor="middle" class="body">필요할 때 정책을 바꾸거나</text><text x="1122" y="542" text-anchor="middle" class="body">운영을 즉시 중단</text>
    <g filter="url(#shadow)"><rect x="1282" y="295" width="240" height="280" rx="24" fill="#fff"/></g><rect x="1306" y="319" width="57" height="30" rx="15" fill="#EAF6DD"/><text x="1334.5" y="340" text-anchor="middle" class="step">05</text><circle cx="1402" cy="398" r="43" fill="#EDF8E1"/><path d="M1402 370l25 10v17c0 17-11 29-25 35c-14-6-25-18-25-35v-17zM1390 394l8 8 16-18" fill="none" stroke="#64A94A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1402" y="485" text-anchor="middle" class="head">안전 정책 적용</text><text x="1402" y="518" text-anchor="middle" class="body">부적절한 요청과</text><text x="1402" y="542" text-anchor="middle" class="body">사용 방식을 제한</text>
    <g filter="url(#shadow)"><rect x="214" y="682" width="1172" height="98" rx="24" fill="#fff"/></g><circle cx="272" cy="731" r="28" fill="#E6F9E4"/><path d="M259 732l9 9 18-21" fill="none" stroke="#3CA96B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="322" y="727" class="footer">에이전트를 공유하더라도,</text><text x="554" y="727" style="font-size:19px;font-weight:800;fill:#438136;letter-spacing:-.5px">어떻게 사용될지는 제작자가 결정합니다.</text><text x="322" y="757" class="body">제작자는 사용 범위와 조건을 설정하고, 운영 중에도 언제든 정책을 변경하거나 중단할 수 있습니다.</text>
  </g>
</svg>
