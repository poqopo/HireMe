<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">제작자 중심 에이전트 관리</title><desc id="desc">제작자가 에이전트의 사용 범위와 조건을 직접 관리하는 세로형 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FCFA"/><stop offset="1" stop-color="#EAF3EE"/></linearGradient>
    <filter id="sh" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#386858" flood-opacity=".14"/></filter>
    <style>.k{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}.title{font-size:37px;font-weight:800;fill:#25483C;letter-spacing:-1.4px}.sub{font-size:18px;font-weight:500;fill:#63786F;letter-spacing:-.5px}.step{font-size:14px;font-weight:800;fill:#386858;letter-spacing:1.2px}.head{font-size:23px;font-weight:800;fill:#294B40;letter-spacing:-1px}.body{font-size:17px;font-weight:500;fill:#677B72;letter-spacing:-.55px}.foot{font-size:20px;font-weight:800;fill:#386858;letter-spacing:-.7px}</style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="1020" cy="45" r="180" fill="#DDECE3"/><circle cx="60" cy="1860" r="170" fill="#E1EEE7"/>
  <g class="k"><text x="540" y="100" text-anchor="middle" class="title">에이전트의 사용 방식은</text><text x="540" y="146" text-anchor="middle" class="title">제작자가 직접 관리합니다</text><text x="540" y="190" text-anchor="middle" class="sub">공유 이후에도 권한, 한도, 정책을 통제할 수 있습니다.</text>
    <!-- card 1 -->
    <g filter="url(#sh)"><rect x="150" y="260" width="780" height="205" rx="26" fill="#fff"/></g><rect x="188" y="293" width="65" height="31" rx="15.5" fill="#E3F0EA"/><text x="220.5" y="314" text-anchor="middle" class="step">01</text><circle cx="276" cy="375" r="48" fill="#E8F3EE"/><path d="M252 388v-32l24-11 24 11v32l-24 13zM263 368h26M263 378h26" fill="none" stroke="#386858" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="362" class="head">수행 가능한 작업 범위 설정</text><text x="360" y="400" class="body">에이전트가 할 수 있는 업무와 도구를 지정합니다.</text>
    <!-- arrow --> <path d="M540 465v62" fill="none" stroke="#70A18F" stroke-width="4" stroke-linecap="round"/><path d="M531 518l9 14 9-14z" fill="#70A18F"/>
    <!-- card 2 -->
    <g filter="url(#sh)"><rect x="150" y="535" width="780" height="205" rx="26" fill="#fff"/></g><rect x="188" y="568" width="65" height="31" rx="15.5" fill="#E3F0EA"/><text x="220.5" y="589" text-anchor="middle" class="step">02</text><circle cx="276" cy="650" r="48" fill="#E8F3EE"/><path d="M276 623a17 17 0 1 1 0 34a17 17 0 0 1 0-34zm-29 65c3-14 16-23 29-23s26 9 29 23M310 636h23v25h-23zM315 636v-6a6 6 0 0 1 12 0v6" fill="none" stroke="#386858" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="637" class="head">사용자별 접근 권한 관리</text><text x="360" y="675" class="body">사용자마다 역할과 접근 범위를 다르게 설정합니다.</text>
    <path d="M540 740v62" fill="none" stroke="#70A18F" stroke-width="4" stroke-linecap="round"/><path d="M531 793l9 14 9-14z" fill="#70A18F"/>
    <!-- card 3 -->
    <g filter="url(#sh)"><rect x="150" y="810" width="780" height="205" rx="26" fill="#386858"/></g><rect x="188" y="843" width="65" height="31" rx="15.5" fill="#5C8978"/><text x="220.5" y="864" text-anchor="middle" fill="#E8F4EE" style="font:800 14px Pretendard,'Apple SD Gothic Neo',sans-serif;letter-spacing:1.2px">03</text><circle cx="276" cy="925" r="48" fill="#5B8878"/><path d="M252 921h48v37h-48zM260 921v-9a16 16 0 0 1 32 0v9M276 933v12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="912" fill="#fff" style="font-size:23px;font-weight:800;letter-spacing:-1px">사용 횟수와 한도 설정</text><text x="360" y="950" fill="#E0F0E8" style="font-size:17px;font-weight:500;letter-spacing:-.55px">사용량, 예산, 실행 횟수를 직접 제한합니다.</text>
    <path d="M540 1015v62" fill="none" stroke="#70A18F" stroke-width="4" stroke-linecap="round"/><path d="M531 1068l9 14 9-14z" fill="#70A18F"/>
    <!-- card 4 -->
    <g filter="url(#sh)"><rect x="150" y="1085" width="780" height="205" rx="26" fill="#fff"/></g><rect x="188" y="1118" width="65" height="31" rx="15.5" fill="#E3F0EA"/><text x="220.5" y="1139" text-anchor="middle" class="step">04</text><circle cx="276" cy="1200" r="48" fill="#E8F3EE"/><path d="M253 1197a24 24 0 1 0 7-17M253 1173v13h13M276 1184v18l12 7" fill="none" stroke="#386858" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="1187" class="head">에이전트 수정 · 중단 · 업데이트</text><text x="360" y="1225" class="body">운영 중에도 정책을 변경하거나 즉시 중단할 수 있습니다.</text>
    <path d="M540 1290v62" fill="none" stroke="#70A18F" stroke-width="4" stroke-linecap="round"/><path d="M531 1343l9 14 9-14z" fill="#70A18F"/>
    <!-- card 5 -->
    <g filter="url(#sh)"><rect x="150" y="1360" width="780" height="205" rx="26" fill="#fff"/></g><rect x="188" y="1393" width="65" height="31" rx="15.5" fill="#E3F0EA"/><text x="220.5" y="1414" text-anchor="middle" class="step">05</text><circle cx="276" cy="1475" r="48" fill="#E8F3EE"/><path d="M276 1447l25 10v17c0 17-11 29-25 35c-14-6-25-18-25-35v-17zM264 1471l8 8 16-18" fill="none" stroke="#386858" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="1462" class="head">부적절한 요청과 사용 방식 제한</text><text x="360" y="1500" class="body">안전 정책을 적용해 허용되지 않은 사용을 차단합니다.</text>
    <g filter="url(#sh)"><rect x="150" y="1650" width="780" height="132" rx="26" fill="#fff"/></g><circle cx="219" cy="1716" r="29" fill="#E2F0E8"/><path d="M206 1717l9 9 18-21" fill="none" stroke="#386858" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="274" y="1706" class="foot">에이전트를 공유하더라도,</text><text x="274" y="1742" class="foot">어떻게 사용될지는 제작자가 결정합니다.</text>
  </g>
</svg>
