<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">에이전트 사용량 기반 수익 구조</title><desc id="desc">에이전트 사용량 측정부터 제작자 수익과 반복 보상까지를 나타낸 순환형 인포그래픽</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#386858" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0l10 6-10 6z" fill="#7FAE9B"/></marker>
    <style>.k{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif}.title{font-size:49px;font-weight:800;fill:#25483C;letter-spacing:-2px}.sub{font-size:23px;font-weight:500;fill:#647970;letter-spacing:-.8px}.num{font-size:15px;font-weight:800;fill:#fff;letter-spacing:1px}.head{font-size:25px;font-weight:800;fill:#294B40;letter-spacing:-1.2px}.body{font-size:18px;font-weight:500;fill:#667A71;letter-spacing:-.7px}.center-sm{font-size:16px;font-weight:800;fill:#CBE2D7;letter-spacing:1.5px}.center-lg{font-size:34px;font-weight:800;fill:#fff;letter-spacing:-1.5px}.center-body{font-size:18px;font-weight:500;fill:#E0F0E8;letter-spacing:-.6px}.foot{font-size:22px;font-weight:800;fill:#386858;letter-spacing:-.9px}</style>
  </defs>
  <g class="k"><text x="960" y="105" text-anchor="middle" class="title">에이전트 사용이 제작자의 지속적인 수익으로 연결됩니다</text><text x="960" y="151" text-anchor="middle" class="sub">사용량을 투명하게 측정하고, 실제 사용에 따라 수익을 정산합니다.</text>
    <!-- circular revenue loop -->
    <path d="M670 343C795 210 1112 206 1260 365C1388 504 1326 727 1163 811" fill="none" stroke="#A2C7B7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1110 841C950 907 732 844 660 701C590 562 620 432 686 360" fill="none" stroke="#A2C7B7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <!-- central engine -->
    <g filter="url(#sh)"><circle cx="960" cy="570" r="180" fill="#386858"/></g><circle cx="960" cy="570" r="144" fill="none" stroke="#78A48F" stroke-width="2" opacity=".7"/><circle cx="960" cy="570" r="115" fill="#477665"/><text x="960" y="518" text-anchor="middle" class="center-sm">USAGE → REVENUE</text><path d="M926 554h68v50h-68zM938 554v-13a22 22 0 0 1 44 0v13M960 572v16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="960" y="647" text-anchor="middle" class="center-lg">수익 정산 엔진</text><text x="960" y="680" text-anchor="middle" class="center-body">사용량 기반으로 자동 연결</text>
    <!-- node 1 -->
    <g filter="url(#sh)"><rect x="160" y="267" width="390" height="174" rx="26" fill="#fff"/></g><circle cx="210" cy="316" r="22" fill="#386858"/><text x="210" y="322" text-anchor="middle" class="num">01</text><circle cx="245" cy="369" r="34" fill="#E3F0EA"/><path d="M230 383v-29l15-7 15 7v29l-15 8zM238 365h14M238 373h14" fill="none" stroke="#386858" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="294" y="350" class="head">사용량 측정</text><text x="294" y="385" class="body">호출 횟수 또는 작업량 기록</text>
    <!-- node 2 -->
    <g filter="url(#sh)"><rect x="1342" y="267" width="418" height="174" rx="26" fill="#fff"/></g><circle cx="1392" cy="316" r="22" fill="#386858"/><text x="1392" y="322" text-anchor="middle" class="num">02</text><circle cx="1427" cy="369" r="34" fill="#E3F0EA"/><path d="M1412 380h30M1417 360h20v26h-20zM1422 367h10" fill="none" stroke="#386858" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1476" y="350" class="head">가격 설정</text><text x="1476" y="385" class="body">작업별 · 사용량별 요금 적용</text>
    <!-- node 3 -->
    <g filter="url(#sh)"><rect x="1392" y="656" width="390" height="174" rx="26" fill="#fff"/></g><circle cx="1442" cy="705" r="22" fill="#386858"/><text x="1442" y="711" text-anchor="middle" class="num">03</text><circle cx="1477" cy="758" r="34" fill="#E3F0EA"/><path d="M1461 748h32v23h-32zM1467 742h20M1467 758h20" fill="none" stroke="#386858" stroke-width="4.5" stroke-linecap="round"/><text x="1526" y="739" class="head">비용 안내</text><text x="1526" y="774" class="body">예상 비용과 사용 내역 제공</text>
    <!-- node 4 -->
    <g filter="url(#sh)"><rect x="130" y="656" width="400" height="174" rx="26" fill="#fff"/></g><circle cx="180" cy="705" r="22" fill="#386858"/><text x="180" y="711" text-anchor="middle" class="num">04</text><circle cx="215" cy="758" r="34" fill="#E3F0EA"/><path d="M200 746h30v25h-30zM207 746v-7a8 8 0 0 1 16 0v7M215 755v9" fill="none" stroke="#386858" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="264" y="739" class="head">제작자 수익 분배</text><text x="264" y="774" class="body">에이전트 사용료를 수익으로 정산</text>
    <!-- node 5 -->
    <g filter="url(#sh)"><rect x="675" y="854" width="570" height="136" rx="26" fill="#fff"/></g><circle cx="728" cy="900" r="23" fill="#386858"/><text x="728" y="906" text-anchor="middle" class="num">05</text><path d="M781 920a23 23 0 1 0 6-16M781 897v12h12" fill="none" stroke="#386858" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="830" y="900" class="head">반복 사용 → 지속적인 보상</text><text x="830" y="932" class="body">많이, 꾸준히 사용될수록 제작자의 수익도 이어집니다.</text>
    <text x="960" y="1040" text-anchor="middle" class="foot">에이전트의 가치가 실제 사용량을 통해 제작자에게 돌아갑니다.</text>
  </g>
</svg>
