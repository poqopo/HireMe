[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hireme-agent"
version = "0.1.0"
description = "Sequential LangChain workflow runtime for hosted HireMe MCP agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "langchain-core>=0.3,<1",
  "mcp>=1.28,<2",
  "openai>=1.0,<3",
  "httpx>=0.28,<1",
  "hireme-github-mcp",
  "jsonschema>=4.23,<5",
  "tzdata>=2025.1",
  "pysui>=1.5.1",
]

[project.scripts]
hireme-agent-api = "hireme_agent.api:main"
hireme-agent-mcp = "hireme_agent.mcp_server:main"

[tool.uv.sources]
hireme-github-mcp = { path = "../github_mcp", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/hireme_agent"]
