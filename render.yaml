services:
  - type: web
    name: hireme-gateway
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run gateway:start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: HIREME_WEB_APP_URL
        value: https://hire-me-bice.vercel.app
      - key: HIREME_GATEWAY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUI_NETWORK
        value: testnet
      - key: SUI_FULLNODE_URL
        value: https://fullnode.testnet.sui.io:443
      - key: HIREME_PLATFORM_TREASURY_SUI_ADDRESS
        sync: false
      - key: HIREME_DEFAULT_CREATOR_SUI_ADDRESS
        sync: false
      - key: HIREME_DEFAULT_HIRE_PRICE_SUI
        value: "0.05"
      - key: HIREME_PLATFORM_FEE_BPS
        value: "0"
      - key: WALRUS_NETWORK
        value: testnet
      - key: WALRUS_AGGREGATOR_URL
        value: https://aggregator.walrus-testnet.walrus.space
      - key: WALRUS_UPLOAD_RELAY_URL
        sync: false
      - key: WALRUS_UPLOAD_RELAY_TIP_MAX_MIST
        value: "1000"
      - key: HIREME_WALRUS_REQUIRED
        value: "1"
      - key: HIREME_WALRUS_PAYER_PRIVATE_KEY
        sync: false
      - key: HIREME_WALRUS_DELETABLE
        value: "0"
      - key: HIREME_WALRUS_READ_TIMEOUT_MS
        value: "30000"
      - key: HIREME_PLATFORM_KMS_KEY
        sync: false
      - key: HIREME_PLATFORM_KMS_KEY_ID
        value: platform:render
      - key: MEMWAL_SERVER_URL
        value: https://relayer-staging.memory.walrus.xyz
      - key: HIREME_MEMWAL_REMEMBER_ASYNC
        value: "0"
      - key: HIREME_MEMWAL_REMEMBER_TIMEOUT_MS
        value: "75000"
      - key: MEMWAL_PRIVATE_KEY
        sync: false
      - key: MEMWAL_ACCOUNT_ID
        sync: false
      - key: HIREME_SEAL_PACKAGE_ID
        sync: false
      - key: HIREME_SEAL_KEY_SERVER_IDS
        sync: false
      - key: HIREME_LLM_PROVIDER
        value: ollama
      - key: OPENAI_API_KEY
        sync: false
      - key: HIREME_OPENAI_MODEL
        value: gpt-5.4-nano
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b-cloud
      - key: HIREME_IMAGE_GENERATION_PROVIDER
        value: openai
